services:
  # ── Backend Web Service ──────────────────────────────────────────
  - type: web
    name: primeplay-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false           # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false           # Set manually in Render dashboard
      - key: TMDB_API_KEY
        sync: false           # Optional — set for live TMDB data
      - key: CLIENT_URL
        sync: false           # Set to your frontend URL after deploy

  # ── Frontend Static Site ─────────────────────────────────────────
  - type: web
    name: primeplay-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false           # Set to your backend URL + /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
